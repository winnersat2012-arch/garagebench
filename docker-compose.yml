services:
  postgres:
    image: postgres:16
    container_name: garagebench-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: garagebench_user
      POSTGRES_PASSWORD: garagebench_pass
      POSTGRES_DB: garagebench
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  pgdata:
