name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-installer-windows:
    runs-on: windows-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias raíz
        run: npm install

      - name: Instalar dependencias de frontend y backend
        run: npm run bootstrap

      - name: Compilar y empaquetar app para Windows
        run: npm run desktop:pack

      - name: Subir instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: garagebench-windows-exe
          path: release/*.exe

      - name: Publicar Release desde tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: GarageBench ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
